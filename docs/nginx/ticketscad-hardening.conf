# TicketsCAD NewUI — nginx hardening snippet
# ============================================================================
#
# nginx NEVER reads .htaccess. The deny rules TicketsCAD ships in its root
# .htaccess, sql/.htaccess and tools/.htaccess do absolutely nothing on nginx.
# If you serve TicketsCAD with nginx, THIS FILE is what protects the install.
#
# Without it, on a default nginx `root /var/www/newui;` config:
#
#     GET /backups/ticketscad-2026-07-30.zip   -> your entire database, to anyone
#     GET /sql/run_migrations.php              -> handed to PHP-FPM and executed
#     GET /inc/db.php                          -> handed to PHP-FPM and executed
#
# HOW TO USE
#
#   1. Copy this file to /etc/nginx/snippets/ticketscad-hardening.conf
#   2. Inside the `server { ... }` block that serves TicketsCAD, add:
#
#          include snippets/ticketscad-hardening.conf;
#
#      Anywhere inside the server block is fine — see "ORDERING" below.
#   3. nginx -t && systemctl reload nginx
#   4. Verify (should print 403 or 404, never 200):
#
#          curl -s -o /dev/null -w '%{http_code}\n' https://your-site/backups/
#          curl -s -o /dev/null -w '%{http_code}\n' https://your-site/sql/run_migrations.php
#          curl -s -o /dev/null -w '%{http_code}\n' https://your-site/tools/
#
#      Settings -> System Health -> "Web exposure" runs the same three probes for you.
#
# ORDERING
#
#   Most of the rules below use nginx's `^~` prefix modifier deliberately. When
#   a `^~` prefix location matches, nginx stops and does NOT evaluate regular-
#   expression locations at all — so these denies beat your
#   `location ~ \.php$ { fastcgi_pass ... }` block no matter which of the two
#   appears first in the file. That is the point: an ordinary
#   `location /sql/ { deny all; }` would LOSE to the PHP regex location and the
#   migration script would still run.
#
#   The services/ rules are the one exception and are order-sensitive relative
#   to each other; keep them in the order given.
#
# WHAT STAYS REACHABLE
#
#   api/  assets/  proxy/  sw/  uploads/  cache/  documentation/  and the
#   top-level .php pages. proxy/dmr-proxy.php especially — the radio widget
#   fetches it over HTTP, so do not add proxy/ to the deny list.
# ============================================================================

# ── Directories that are not part of the web interface ──────────────────────
# apache/       vhost example
# backups/      DATABASE DUMPS — the 2026-07-30 exposure
# coordination/ drafts/ specs/   project notes
# inc/          PHP includes (db.php holds the database credentials)
# keys/         encryption keys, if an install has one inside the tree
# sql/ tools/   command-line migration + maintenance scripts
# tests/        test suite
# vendor/       composer dependencies
location ^~ /apache/       { deny all; }
location ^~ /backups/      { deny all; }
location ^~ /coordination/ { deny all; }
location ^~ /drafts/       { deny all; }
location ^~ /inc/          { deny all; }
location ^~ /keys/         { deny all; }
location ^~ /specs/        { deny all; }
location ^~ /sql/          { deny all; }
location ^~ /tests/        { deny all; }
location ^~ /tools/        { deny all; }
location ^~ /vendor/       { deny all; }

# ── services/ — denied, with one deliberate hole ────────────────────────────
# The Mesh Console (Settings -> Mesh Bridges (LoRa)) hands the operator a
#   curl -sSfo $HOME/bridge_v2.py 'https://your-site/services/meshtastic/bridge_v2.py'
# command to install the Meshtastic bridge on their radio host, so the bridge
# scripts must stay downloadable. Nothing else under services/ should be: a
# live install keeps listener.ini (which contains an APRS-IS passcode), .env
# files and services/*/logs/ there.
#
# Order matters here. `location /services/` is a PLAIN prefix (no `^~`), so
# nginx still evaluates regex locations, and the regex below wins for the two
# bridge directories. Do not add `^~` to the first line — it would shut the
# hole and break the documented bridge install.
location /services/ { deny all; }
location ~ ^/services/(meshtastic|meshcore)/[A-Za-z0-9_.-]+\.py$ {
    default_type text/plain;
    try_files $uri =404;
}

# ── .git and other dotfiles ─────────────────────────────────────────────────
# Converting a ZIP install to a git clone creates .git INSIDE the web root;
# .git/config exposes the remote and .git as a whole reconstructs the source.
# /.well-known/ is excluded so ACME / Let's Encrypt renewal keeps working.
location ~ /\.(?!well-known) { deny all; }

# ── Sensitive file types anywhere in the tree ───────────────────────────────
location ~ \.(sql|log|bak|old|orig|rej|swp|pem|p8)$ { deny all; }

# ── Never let PHP execute out of a directory users can write to ─────────────
# uploads/ and cache/ receive attachments and generated files. The upload
# endpoints enforce an extension allowlist on the write side; this is the same
# boundary on the read side, in case a future bug lets something through.
location ~ ^/(uploads|cache)/.*\.(php|phar|phtml|pht|phtm|inc|html?|svg|xml|xsl|vbs|js)$ {
    deny all;
}

# ── GHSA-x9x6-w4fg-pmcc — deny cache/zello-audio/ specifically ─────────────
# Recordings are written outside the web root now (inc/zello_audio_dir.php)
# and served only through the authenticated api/zello-audio.php; nothing
# should ever fetch a URL under here again. Defense-in-depth for whatever
# sql/run_zello_audio_relocate.php hasn't moved yet. ^~ so this wins over the
# extension-based location block above (prefix matches beat regex matches in
# nginx only when marked ^~ — the project has been bitten before by a plain
# prefix losing to a later regex location).
location ^~ /cache/zello-audio/ { deny all; }

# ── No directory listings ───────────────────────────────────────────────────
# This is nginx's default; state it so a copied config that turned autoindex on
# somewhere above does not leak a listing here.
autoindex off;
