name: Bug report
description: Tell us about something that isn't working in TicketsCAD
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping test TicketsCAD! Please DON'T include real names, addresses, phone numbers, patient info, or amateur-radio callsigns in your report — these reports are visible to the whole test team. Never paste a password, API key, or database credential — replace it with REDACTED."
  - type: markdown
    attributes:
      value: "**Think it might be a security vulnerability? Don't file it here.** Use the private channel in [SECURITY.md](https://github.com/openises/TicketsCAD/blob/main/SECURITY.md) so a fix exists before the problem is public."
  - type: input
    id: version
    attributes:
      label: Which version are you running?
      description: "Help → About shows it. Fixes land on the newest release line only, so this decides how the report is triaged — see SECURITY.md."
      placeholder: e.g. 4.2.2
    validations:
      required: true
  - type: input
    id: git-commit
    attributes:
      label: If you installed with git, which commit is it on?
      description: "Run  git log -1 --format='%h %cd'  in your install folder and paste the line. The version number alone no longer says whether a particular fix is present, because fixes reach main between releases. Leave blank for a Docker image or a ZIP."
      placeholder: e.g. 3a1f9c2 Fri Oct 2 14:11:00 2026 -0500
  - type: dropdown
    id: install-method
    attributes:
      label: How is it installed?
      options:
        - Docker (docker compose)
        - Git clone on a Linux server
        - Git clone on Windows (XAMPP or similar)
        - Uploaded a ZIP to shared hosting
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: live-operations
    attributes:
      label: Is this affecting live operations right now?
      description: Only so a report from a real, current operation is read first. "No" is the normal answer and loses nothing.
      options:
        - Yes, right now
        - No, found while testing or reviewing
        - Not sure
    validations:
      required: true
  - type: input
    id: what-page
    attributes:
      label: What page or screen were you on?
      placeholder: e.g. New Incident form, Dashboard, Roster
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What steps lead to it?
      placeholder: |
        1. Clicked ...
        2. Typed ...
        3. Saw ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image into this box if you have one.
  - type: input
    id: browser
    attributes:
      label: What device / browser?
      placeholder: e.g. Windows laptop, Chrome; or iPhone, Safari
  - type: checkboxes
    id: health-check
    attributes:
      label: System Health
      description: Most environment problems (a missing scheduled job, exposed folders, an uninstalled dependency) show up there in one screen.
      options:
        - label: I opened Settings, System Health, and pasted anything red (or it was all green).
          required: false
