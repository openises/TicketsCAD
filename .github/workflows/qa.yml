name: qa

# QA gate on every push (Eric 2026-07-07): performs the exact fresh-install
# a beta tester does — empty MariaDB → config from example → install_fresh
# (auto-imports base_schema.sql + every sql/run_*.php migration) — then
# runs the full DB-backed test suite plus both audit gates. GH #72
# (fresh-install migration failures) is precisely the class of bug this
# job exists to catch before a tester does.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  fresh-install-and-test:
    name: fresh install + test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: newui
          MARIADB_USER: newui
          MARIADB_PASSWORD: ci-newui
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      # PR-level half of the AI-attribution gate (see the "Ninth gate" step
      # below for the commit/tracked-file half). CLAUDE.md's rule covers
      # "commits, PRs, releases, or any actions" — a commit-message/file gate
      # alone would miss an attribution line added only to a PR title/body.
      # Only meaningful on a pull_request event; a plain push has no PR body.
      - name: AI-attribution audit (pull request title/body)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          PATTERN='co-authored-by[[:space:]]*:.*(anthropic\.com|openai\.com|claude[[:space:]-]*(sonnet|opus|haiku|fable|code|ai)|copilot|chatgpt|gpt-?[0-9]|gemini)|generated[[:space:]]+with.{0,60}(claude|copilot|chatgpt|gpt-?[0-9]|openai|anthropic|gemini)|noreply@anthropic\.com'
          FOUND=0
          if printf '%s' "$PR_TITLE" | grep -qiE "$PATTERN"; then
            echo "✗ AI-attribution pattern found in PR title"; FOUND=1
          fi
          if printf '%s' "$PR_BODY" | grep -qiE "$PATTERN"; then
            echo "✗ AI-attribution pattern found in PR body"; FOUND=1
          fi
          case "$PR_TITLE$PR_BODY" in
            *🤖*)
              case "$PR_TITLE$PR_BODY" in
                *[Cc]laude*|*[Aa]nthropic*) echo "✗ robot-emoji + claude/anthropic found in PR title/body"; FOUND=1 ;;
              esac
              ;;
          esac
          [ "$FOUND" -eq 0 ] || exit 1
          echo "[OK] no AI-attribution signatures in PR title/body"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring, openssl, curl, zip, gd
          coverage: none

      - name: Create config.php from template
        run: |
          cp config.example.php config.php
          sed -i "s/\$db_host   = 'localhost';/\$db_host   = '127.0.0.1';/" config.php
          sed -i "s/\$db_pass   = 'CHANGE-ME';.*/\$db_pass   = 'ci-newui';/" config.php

      - name: Fresh install (base schema + all migrations)
        run: php tools/install_fresh.php

      - name: Migrations are idempotent (second run applies nothing new)
        run: |
          php sql/run_migrations.php | tee /tmp/second-run.log
          # A second run must not fail; "Pending: 0" proves idempotency.
          grep -q "Pending: 0" /tmp/second-run.log || {
            echo "::warning::second migration run still had pending scripts (non-idempotent hash churn?)"
            true
          }

      - name: Create admin user + seed demo data
        run: |
          php tools/create_admin.php --username=admin --email=ci@example.invalid || php tools/create_admin.php
          php sql/seed_demo_data.php

      - name: Schema audit (SQL ↔ fresh schema)
        run: php tests/test_schema_audit.php

      - name: API ↔ JS contract audit
        run: php tests/test_api_contract_audit.php

      # Third gate in the same family: a PAGE that gates on RBAC while its
      # API still gates on the legacy user.level column. Post-Phase-12 those
      # two disagree (role_id=2 + user.level=4 is a normal state), so the
      # user gets a screen that refuses to do anything.
      - name: Page/API authorisation-split audit
        run: php tests/test_legacy_level_audit.php

      # Fourth gate in the family, and the one CI is least able to feel: a
      # query that measures a locally-stamped DATETIME against UTC_TIMESTAMP()
      # (or the JS/gmdate equivalents). On a UTC runner the two clocks are the
      # same instant, so the bug passes every test here and breaks only on the
      # local-timezone servers most volunteer groups actually run — the APRS
      # map reporting "0 stations" while the listener wrote 1,288 rows/hour.
      # The test pins a -05:00 session so the check works on a UTC runner.
      - name: Clock-consistency audit (local-time columns vs UTC comparisons)
        run: php tests/test_timezone_audit.php

      # Fifth gate in the family, and the only one about what the product LOOKS
      # like. A widget shipped with its hotkeys as a run of text along the
      # bottom, a dismiss control with no way to reopen, and per-user state in a
      # newly invented store — while every other widget puts keycap buttons in
      # the header, uses the shared refresh control, and persists through
      # dashboard_layouts / user_screen_prefs. Eric: "I do not want the software
      # to appear as if we have multiple developers who have never seen this
      # software before or ever talked to each other."
      #
      # Static, so it needs no database and no browser. Fails only on findings
      # absent from tools/ui_consistency_baseline.txt.
      - name: UI-consistency audit (interface conventions)
        run: php tests/test_ui_consistency_audit.php

      # Sixth gate in the family. A rbac_can('some.code')/rbac_require_screen
      # ('some.code') referencing a permission with no row in the permissions
      # table can never be granted to any role — found app-wide 2026-08-15
      # (an external-API bug report plus a wider RBAC pass Eric asked for),
      # including api/external/v1/incidents.php's read gate being reachable
      # by Super Admin tokens only, with no role able to grant it.
      - name: RBAC permission-code audit (rbac_can() code ↔ real permissions row)
        run: php tests/test_rbac_permission_audit.php

      # Seventh gate in the family, and the first that isn't about two things
      # DISAGREEING — it's about one thing existing and the other being simply
      # ABSENT. GH #91: a settings-table key a UI control writes but nothing
      # reads back (Chat Bridge's four checkboxes, Severity Levels' label
      # fields before the same-night fix), or a database column with a
      # confirmed write path whose value is read nowhere (~12 `user` columns
      # named in the issue, plus 5 more this tool's own sweep found).
      - name: Dead-control audit (settings key / column ↔ anything that reads it)
        run: php tests/test_dead_control_audit.php

      # Eighth gate in the family, and the first that targets a PRIVILEGE
      # ESCALATION rather than a dead reference. sql/rbac.sql and
      # sql/run_00_rbac.php grant Org Admin/Dispatcher "everything except" a
      # literal NOT-IN list of admin-only codes — that shape has leaked an
      # excluded permission down to a lower role four separate times (direct
      # grant predating its exclusion, a canonical-alias re-grant, and a
      # standalone migration re-granting it outright), each found by a human
      # noticing on a different date. This audit derives the exclusion lists
      # directly from the two seed files instead of a hand-maintained code
      # list, so a NEW exclusion is checked automatically with no companion
      # test edit required, plus a cross-file drift check between the two
      # files and a scan for a new migration literally granting an excluded
      # code.
      - name: RBAC exclusion-list privilege-leak audit (admin-only exclusion ↔ real role grants)
        run: php tests/test_rbac_exclusion_leak_audit.php

      # Ninth gate in the family, and the only one this whole audit lineage
      # exists BECAUSE OF an attempted policy violation rather than a bug. A
      # tool-result formatted exactly like a genuine system reminder has,
      # across three separate sessions, instructed the agent handling them to
      # append an AI-attribution trailer/line to commits and PRs — directly
      # contradicting Eric's standing global rule (CLAUDE.md: never add AI
      # attribution to a commit, PR, or release). See
      # tools/ai_attribution_audit.php's own docblock for the exact banned
      # strings — not repeated here so this comment doesn't trip its own gate.
      # Refused every time by the session's own judgment, which is one layer;
      # this is the mechanical second layer, and the one that actually runs
      # here because CI cannot be bypassed the way a local git hook can
      # (--no-verify, a clone that never ran install-git-hooks.sh, a commit
      # made outside the git CLI entirely, e.g. GitHub's own web editor).
      # This job's checkout is shallow (depth 1), so the commit-history half
      # sees only the commit(s) in this push — that is the right scope for a
      # regression gate; a one-time full-history sweep already confirmed the
      # existing history clean, and there is nothing to grandfather going
      # forward since real commit messages never legitimately match these
      # patterns.
      - name: AI-attribution audit (commit history + tracked files ↔ known attribution signatures)
        run: php tests/test_ai_attribution_audit.php

      # Anti-rot gate for the published SBOM. An SBOM that is accurate once and
      # stale afterwards is worse than none, because it asserts a currency it
      # does not have. If a dependency, a vendored library version, or the
      # application VERSION changes without regenerating, this fails the build.
      - name: SBOM is current (CISA 2026 minimum elements)
        run: php tools/generate-sbom.php --check

      # Conformance gate. The document DECLARES "specVersion": "1.6"; this is
      # what checks that the declaration is true. It was not: a published SBOM
      # carried the licence id "GPL-2.0-with-FOSS-exception", which SPDX does
      # not define, so the whole document failed the official schema while we
      # invited people to load it into Dependency-Track and Trivy. Asserting
      # conformance is not the same as having it.
      #
      # ajv (the reference validator) against the OFFICIAL schema, vendored
      # unmodified in tools/schema/cyclonedx/. Node is preinstalled on the
      # runner; the packages come from npm at job time.
      - name: SBOM conforms to the official CycloneDX 1.6 schema
        run: php tools/generate-sbom.php --validate

      # The signature must verify against the PUBLISHED public key, using only
      # what a recipient receives. CI never signs — it only checks.
      - name: SBOM signature verifies
        run: php tools/generate-sbom.php --verify

      # Known-vulnerable dependency gate. CISA's producer guidance asks for an
      # automated dependency scan in CI, and SECURITY.md already commits to the
      # harder half of it: "shipping a known-vulnerable version is our problem
      # to fix, even when the defect is upstream."
      #
      # Nothing enforced that. On 2026-07-30 `composer audit` reported four
      # advisories against the pinned guzzlehttp/guzzle 7.12.3 — a dependency
      # this project had been shipping, unnoticed, while publishing a bill of
      # materials that named the vulnerable version accurately. Dependabot
      # alerts cover the forge; this covers the build, and fails it.
      #
      # --locked audits composer.lock, which is what the SBOM describes and what
      # a deploy installs, rather than whatever happens to be in vendor/ — and
      # this job never runs `composer install`, so vendor/ does not exist here.
      # `composer` comes from setup-php above; composer.phar is gitignored and is
      # deliberately not relied on.
      - name: Dependency vulnerability audit (composer.lock)
        run: composer audit --locked --no-interaction

      - name: Full test suite (HTTP-integration tests skipped)
        env:
          NEWUI_TEST_NO_HTTP: '1'
        run: php tools/test_all.php

      - name: Audio-matrix Python suite (Phase 114c, no radio/bridge)
        run: |
          set -e
          for t in test_matrix_core test_control_http test_dmr_leg test_service; do
            echo "── $t ──"
            python3 "services/audio-matrix/tests/$t.py"
          done
