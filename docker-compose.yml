# TicketsCAD NewUI v4 — full deployment stack (app + MariaDB).
#
#   1. cp .env.example .env      # then edit the passwords in .env
#   2. docker compose up -d      # builds the app image, starts DB + app
#   3. open http://localhost:8081  (admin password is printed in the logs:
#                                   docker compose logs app | grep -i password)
#
# The app auto-installs the schema on first run and auto-applies migrations on
# every subsequent `docker compose up` (idempotent). Data, uploads, backups and
# the encryption keys live in named volumes so they survive container recreation
# — `up -d --build` replaces the container, and anything not on a volume dies
# with it.
#
# UPGRADING FROM A COMPOSE FILE WITHOUT `app_backups`: any backup already sitting
# in the old container is in its writable layer and will NOT migrate into the new
# volume. Rescue it BEFORE the first rebuild — see docs/DOCKER.md §4.
#
# UPGRADING FROM A COMPOSE FILE THAT MOUNTED app_backups AT /var/www/html/backups:
# the volume itself carries over unchanged — only the path it is mounted at moves
# (v4.2.3 took backups out of the web root). Nothing to rescue; the same archives
# appear at the new location.
services:
  db:
    image: mariadb:11
    container_name: ticketscad_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${NEWUI_DB_NAME:-newui}
      MARIADB_USER: ${NEWUI_DB_USER:-newui}
      MARIADB_PASSWORD: ${NEWUI_DB_PASS:-newui}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  app:
    build: .
    image: ticketscad-newui:local
    container_name: ticketscad_newui
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEWUI_DB_HOST: db
      NEWUI_DB_NAME: ${NEWUI_DB_NAME:-newui}
      NEWUI_DB_USER: ${NEWUI_DB_USER:-newui}
      NEWUI_DB_PASS: ${NEWUI_DB_PASS:-newui}
      NEWUI_BASE_URL: ${NEWUI_BASE_URL:-http://localhost:8081}
      # First-run admin. Leave ADMIN_PASSWORD blank to auto-generate one
      # (printed in `docker compose logs app`). First login forces a change.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.invalid}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Seed demo incident types / sample units + facilities on first install.
      NEWUI_SEED_DEMO: ${NEWUI_SEED_DEMO:-false}
    ports:
      - "${NEWUI_PORT:-8081}:80"
    volumes:
      - app_uploads:/var/www/html/uploads
      - app_cache:/var/www/html/cache
      - app_backups:/var/www/backups    # database backups. TWO reasons for this line:
                                        #  1. MUST be a volume: `up -d --build`
                                        #     recreates the container and destroys its
                                        #     writable layer, so an unmounted backups
                                        #     dir takes your pre-update restore point
                                        #     with it.
                                        #  2. Mounted OUTSIDE /var/www/html — the
                                        #     Apache DocumentRoot — since v4.2.3. A
                                        #     backup inside the web root was
                                        #     downloadable by anyone who guessed the
                                        #     filename (see docs/security/
                                        #     advisory-2026-07-30-exposed-directories.md).
      - app_keys:/var/www/keys          # 2FA + RSA field-encryption keys (out of webroot)
      - app_tile_cache:/var/www/tile-cache
                                        # Map tiles fetched by api/tile-proxy.php.
                                        # Mounted OUTSIDE /var/www/html on purpose: this
                                        # cache is a record of which map areas — and so
                                        # roughly which incident locations — this
                                        # install has viewed. Inside the web root it
                                        # would be readable without logging in, which is
                                        # precisely what proxy mode exists to prevent.
                                        # A volume rather than the container's writable
                                        # layer so `up -d --build` does not throw the
                                        # cache away and make the install re-fetch every
                                        # tile at once — a load spike upstream providers
                                        # specifically ask us not to cause.
      - app_geocode_cache:/var/www/geocode-cache
                                        # Address lookup cache (inc/geocode.php). Same
                                        # reasoning as app_tile_cache: outside the web
                                        # root, and a volume so a rebuild doesn't throw
                                        # it away and re-hit the geocoding provider for
                                        # every address at once.
      - app_zello_audio:/var/www/zello-audio
                                        # Zello voice-message recordings
                                        # (GHSA-x9x6-w4fg-pmcc). MUST be a volume for the
                                        # same reason app_backups must: `up -d --build`
                                        # destroys the writable layer, and an unmounted
                                        # recordings dir takes every voice message with
                                        # it. Outside /var/www/html since these were the
                                        # advisory's entire subject.
      # To supply your own config.php instead of the env-generated one, mount it:
      # - ./config.php:/var/www/html/config.php:ro
      #
      # Prefer backups on the HOST (easy to copy off-box, survives `down -v`)?
      # Replace the app_backups line above with a bind mount and drop the named
      # volume from the `volumes:` block at the bottom. Keep the container side
      # at /var/www/backups — /var/www/html is served.
      # - ./backups:/var/www/backups

  # ── Optional voice features: browser push-to-talk over Zello + DMR ──────────
  #   Start with:   docker compose --profile voice up -d
  #   These reuse the app image (no extra image to build) and run the PHP Ratchet
  #   WebSocket relays the radio widget connects to, via the app's /zello-ws and
  #   /dmr-ws paths (wired in the Dockerfile). Configure Zello credentials + DMR
  #   channels in Settings first. Leave the proxy ports at their defaults
  #   (8090 / 8092) so the app's built-in WS routing matches.
  zello-proxy:
    profiles: ["voice"]
    build: .
    image: ticketscad-newui:local
    container_name: ticketscad_zello_proxy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEWUI_DB_HOST: db
      NEWUI_DB_NAME: ${NEWUI_DB_NAME:-newui}
      NEWUI_DB_USER: ${NEWUI_DB_USER:-newui}
      NEWUI_DB_PASS: ${NEWUI_DB_PASS:-newui}
    # Override the image entrypoint: proxies only need config.php + the daemon.
    # They must NOT run the schema install/migrate — the app container owns that
    # (running it in every container races and corrupts the install).
    entrypoint: ["sh", "-c", "php /var/www/html/docker-config-gen.php && exec php /var/www/html/proxy/zello-proxy.php"]
    volumes:
      - app_keys:/var/www/keys          # shared field-encryption keys (to read stored Zello creds)
      - app_zello_audio:/var/www/zello-audio   # this is the service that WRITES recordings

  dmr-proxy:
    profiles: ["voice"]
    build: .
    image: ticketscad-newui:local
    container_name: ticketscad_dmr_proxy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEWUI_DB_HOST: db
      NEWUI_DB_NAME: ${NEWUI_DB_NAME:-newui}
      NEWUI_DB_USER: ${NEWUI_DB_USER:-newui}
      NEWUI_DB_PASS: ${NEWUI_DB_PASS:-newui}
    entrypoint: ["sh", "-c", "php /var/www/html/docker-config-gen.php && exec php /var/www/html/proxy/dmr-proxy.php"]
    volumes:
      - app_keys:/var/www/keys

volumes:
  db_data:
  app_uploads:
  app_cache:
  app_backups:
  app_keys:
  app_tile_cache:
  app_geocode_cache:
  app_zello_audio:
